name: CI Pipeline

on:
  push:
    branches: [main, v2-consolidation]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          VITE_VOICE_API_URL: ${{ secrets.VITE_VOICE_API_URL }}
          VITE_VOICE_API_KEY: ${{ secrets.VITE_VOICE_API_KEY }}
          VITE_AGENT_ID: ${{ secrets.VITE_AGENT_ID }}
          VITE_PHONE_NUMBER_ID: ${{ secrets.VITE_PHONE_NUMBER_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  gateway:
    name: Gateway (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6399:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build gateway
        run: npm run build

      - name: Run integration tests
        run: npm test
        env:
          REDIS_TEST_URL: redis://localhost:6399
          GATEWAY_TEST_PORT: 4602

  backend:
    name: Legacy API (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: champqualifier:test
          build-args: |
            VITE_VOICE_API_URL=https://api.elevenlabs.io/v1
            VITE_VOICE_API_KEY=test
            VITE_AGENT_ID=test
            VITE_PHONE_NUMBER_ID=test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [web, gateway, backend, docker]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.web.result }}" != "success" ] ||
             [ "${{ needs.gateway.result }}" != "success" ] ||
             [ "${{ needs.backend.result }}" != "success" ] ||
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
