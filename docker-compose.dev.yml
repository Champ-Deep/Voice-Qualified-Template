services:
  redis:
    image: redis:7-alpine
    container_name: champqualifier-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - champqualifier-network-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_VOICE_API_URL: ${VITE_VOICE_API_URL:-https://api.elevenlabs.io/v1}
        VITE_VOICE_API_KEY: ${VITE_VOICE_API_KEY}
        VITE_AGENT_ID: ${VITE_AGENT_ID}
        VITE_PHONE_NUMBER_ID: ${VITE_PHONE_NUMBER_ID}
    container_name: champqualifier-app-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - champqualifier-network-dev
    restart: unless-stopped

networks:
  champqualifier-network-dev:
    driver: bridge

volumes:
  redis_data_dev:
    driver: local
