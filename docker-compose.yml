services:
  redis:
    image: redis:7-alpine
    container_name: champqualifier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - champqualifier-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_VOICE_API_URL: ${VITE_VOICE_API_URL:-https://api.elevenlabs.io/v1}
        VITE_AGENT_ID: ${VITE_AGENT_ID}
        VITE_PHONE_NUMBER_ID: ${VITE_PHONE_NUMBER_ID}
    container_name: champqualifier-app
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - NODE_ENV=production
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AGENT_ID=${AGENT_ID}
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - champqualifier-network
    restart: unless-stopped

networks:
  champqualifier-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
